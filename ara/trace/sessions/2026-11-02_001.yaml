key_context:
- turn: 15
  excerpt: The red Codecov status was an ordering artefact of two partial uploads, not a coverage regression; one upload from the job that runs everything removes the race without a fragile expected-upload count.
- turn: 13
  excerpt: Clipping the rootless Halofit solution kept Pnl finite, so the finiteness check never fired; returning NaN makes the failure observable.
- turn: 3
  excerpt: Coverage failures came from JAX tests skipping in CI, not from missing tests; a dedicated job fixed that and exposed the photometric module as the real gap.
- turn: 5
  excerpt: Autodiff and finite differences only agree once the step stays inside one interpolation cell, because the de-wiggled power has kinks at the fixed k nodes.
