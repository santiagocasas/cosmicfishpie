# CLASS HMcode2020 profile for photometric forecasts matched to the emulator calibrated limit.
# P_k_max_1/Mpc = 5.0 matches the k_max of EE2 (~9.4 h/Mpc) and SYREN-NEW (9 h/Mpc).
PARAMETER_TRANSLATION:
  'neutrino_scheme': 'three_degenerate'
  'N_ur': 0.00641
  'neutrino_mass_fac': 93.14
ACCURACY: {}
COSMO_SETTINGS:
  'P_k_max_1/Mpc': 5.0
  'output': 'mPk,mTk'
  'non linear': 'hmcode_2020'
  'nonlinear_min_k_max': 5.0
  'z_max_pk': 3.0
  'N_ncdm': 3
  'tau_reio': 0.0561
LCDM:
  'Omega_Lambda': 0.0
  'Omega_k': 0.0
w0waCDM:
  'Omega_Lambda': 0.0
  'Omega_k': 0.0
