interpretation:
  supported: >-
    The gap is set by the matter power model and amplified by galaxy-bias marginalization;
    the JAX observable, covariance, Fisher assembly and autodiff reproduce their same-theory
    counterparts.
  not_supported: >-
    That either model is the more accurate description of the true nonlinear matter power, or
    that the response-optimised SYREN coefficients reduce this difference.
  promotion: staged as O23; requires researcher assessment.

linear_shape_channel:
  # Follow-up N93: both backends are "Eisenstein-Hu" but not the same formula.
  syren_linear_model: >-
    sign = plin_new_emulated = get_eisensteinhu_nw(k) * D(k,a)^2 * exp(logF_fiducial)
    * growth_correction_R * S(k); the wiggle and broadband content comes from the fitted
    logF correction (Bartlett et al. 2023) and the S(k) correction, not from the bare EH fit.
  jax_linear_model: Eisenstein-Hu 1998 with baryon wiggles (eisenhu_osc), sigma8 normalised.
  growth_ratio_syren_over_jax: {z0: 1.00000, z0.5: 1.00039, z1: 1.00033, z2: 1.00038}
  linear_ratio_z0_by_band:
    0.001-0.005: 1.00320
    0.005-0.02: 1.01637
    0.02-0.05: 1.00926
    0.05-0.1: 0.98717
    0.1-0.2: 0.99135
    0.2-0.5: 1.00927
    0.5-1: 1.01605
  halofit_on_syren_linear_marginalized_sigma_As:
    value: 0.0301323
    versus_syren: 1.0235
    versus_jax: 1.1410
  reference_sigma_As: {syren: 0.0294396, jax_ad: 0.0264081}
  conclusion: >-
    The linear input carries essentially all of the ~10% gap; the nonlinear prescriptions
    differ in the opposite direction at the percent level. Commit 1c5b946.
  promotion: staged as O24; requires researcher assessment.
