  status: resolved
  children:
    - id: V-N14
      type: dead_end
      title: "Do not put CAMB neutrino bookkeeping in shared fiducials"
      provenance: user-revised
      timestamp: "2026-09-16T13:58"
      hypothesis: "The benchmark needed num_nu_massive in its shared CAMB/CLASS fiducial, and CLASS should silently discard it in changebasis_class()."
      failure_mode: "Validated Fishers use a backend-neutral physical fiducial; CAMB receives num_nu_massive from its solver YAML and CLASS receives N_ncdm from its own YAML. Adding the CAMB-only key to the shared benchmark fiducial caused the CLASS rejection."
      lesson: "Keep backend bookkeeping in backend YAMLs and pass the same physical mnu/Neff fiducial to CAMB and CLASS; do not broaden the CLASS translator to accept misplaced CAMB options."
      evidence: ["scripts/validation_configs/common_specs_paper_LCDM_mnu_Neff.json", "cosmicfishpie/configs/default_boltzmann_yaml_files/camb/nuvalidation_hp.yaml", "cosmicfishpie/configs/default_boltzmann_yaml_files/class/nuvalidation_uhp.yaml", "scripts/benchmark_fiducial_scaling.py"]
      status: resolved
    - id: V-N15
      type: experiment
      title: "Diagnose CLASS nonlinear redshift margin"
      provenance: user
      timestamp: "2026-09-16T16:48"
      description: "Reproduce the post-pull CLASS failure directly with classy 3.3.4.0 and sweep nonlinear_min_k_max for the benchmark fiducial with hmcode_2020 and z_max_pk=5."
      evidence: ["results/fiducial_scaling/20260916T144207Z/trials/omp01_warmup01.log", "classy/source/perturbations.c:1707-1714", "classy/python/classy.pyx:1757-1769"]
      result: "CLASS deliberately samples to z_max_pk+1, so z_max_pk=5 requests an internal z=6 grid. nonlinear_min_k_max=80 reaches nonlinear validity only to z=5.348928; the user-reported cluster sweep found 120 as the passing threshold, with 150 proposed as a safety margin."
      status: resolved
