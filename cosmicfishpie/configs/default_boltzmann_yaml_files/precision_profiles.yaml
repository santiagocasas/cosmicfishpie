# Canonical solver precision profiles for the neutrino validation track.
# Provenance: SensitivityNeutrinos.htm (arXiv:2405.06047v1), Appendix.
profiles:
  camb_hp:
    ACCURACY:
      'kmax': 50
      'k_per_logint': 50
      'AccuracyBoost': 3
      'lAccuracyBoost': 3
      'lSampleBoost': 1
      'accurate_massive_neutrino_transfers': True
    NUMERICS:
      'zmax': 5
      'zsamples': 100
    COSMO_SETTINGS:
      'halofit_version': 'mead2020'
      'dark_energy_model': 'ppf'
      'num_nu_massive': 1
      'TCMB': 2.7255
      'WantTensors': False
      'WantVectors': False
      'Reion.Reionization': False
      'WantCls': False
      'Want_CMB': False
      'Want_CMB_lensing': False
      'Want_cl_2D_array': False
      'DoLateRadTruncation': True
      'DoLensing': False

  class_hp:
    ACCURACY:
      'k_per_decade_for_bao': 50
      'k_per_decade_for_pk': 50
      'l_max_g': 20
      'l_max_pol_g': 15
      'radiation_streaming_approximation': 2
      'radiation_streaming_trigger_tau_over_tau_k': 240.
      'radiation_streaming_trigger_tau_c_over_tau': 100.
      'tol_ncdm_synchronous': 1.e-5
      'l_max_ncdm': 25
      'ncdm_fluid_trigger_tau_over_tau_k': 100.
      'background_Nloga': 6000
      'thermo_Nz_log': 20000
      'thermo_Nz_lin': 40000
      'tol_perturbations_integration': 1.e-6
      'hmcode_tol_sigma': 1.e-8
    COSMO_SETTINGS:
      'P_k_max_1/Mpc': 50
      'output': 'mPk,mTk'
      'non linear': 'hmcode2020'
      'nonlinear_min_k_max': 80.
      'z_max_pk': 4.0
      'N_ncdm': 1
      'T_cmb': 2.7255
      'k_pivot': 0.05

  class_uhp:
    ACCURACY:
      'k_per_decade_for_bao': 50
      'k_per_decade_for_pk': 50
      'l_max_g': 20
      'l_max_pol_g': 15
      'radiation_streaming_approximation': 2
      'radiation_streaming_trigger_tau_over_tau_k': 240.
      'radiation_streaming_trigger_tau_c_over_tau': 100.
      'tol_ncdm_synchronous': 1.e-5
      'l_max_ncdm': 40
      'ncdm_fluid_approximation': 3
      'background_Nloga': 6000
      'thermo_Nz_log': 20000
      'thermo_Nz_lin': 40000
      'tol_perturbations_integration': 1.e-6
      'hmcode_tol_sigma': 1.e-8
    COSMO_SETTINGS:
      'evolver': 0
      'P_k_max_1/Mpc': 20
      'output': 'mPk,mTk'
      'non linear': 'hmcode2020'
      'nonlinear_min_k_max': 5.
      'z_max_pk': 2.0
      'N_ncdm': 1
      'T_cmb': 2.7255
      'k_pivot': 0.05
