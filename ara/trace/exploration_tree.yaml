- id: N83
  type: dead_end
  title: Differentiating through a bisection root find gives the wrong implicit derivative
  provenance: ai-executed
  timestamp: '2026-10-27T16:05'
  hypothesis: >-
    A bracketed bisection on sigma^2(R) = 1/growth^2 can replace jax-cosmo's fixed-grid
    interpolation of the nonlinear scale while staying differentiable.
  failure_mode: >-
    Autodiff through 100 bisection steps returned a derivative that disagreed with finite
    differences by 54% at every step size (1e-2, 1e-3, 1e-4), while the values stayed
    correct to 4.7e-4 of jax-cosmo. The parameter dependence of a bisection lives in its
    branch conditions, which autodiff discards, so the traversal converges to a value but
    not to the implicit derivative.
  lesson: >-
    Use a fixed-count Newton iteration on the smooth residual instead: a converged
    differentiable fixed point differentiates to the implicit derivative. That version
    reproduces jax-cosmo's Halofit values to median 2.0e-05 and is smooth in the parameters
    (AD vs FD 1.6e-05 at a 1% step, scaling as the step squared).
  evidence:
  - ../../../cfp-jaxcosmo/cosmicfishpie/cosmology/jaxcosmo_halofit.py
  status: resolved
  also_depends_on: [N82]
