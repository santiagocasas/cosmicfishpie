# WL and GCsp are evaluated by separate component contexts and summed under the
# explicit statistical-independence approximation declared below.
name: "fresh_wl_gcsp_symbolic_independent_32x1"
fiducial:
  Omegam: 0.3191
  Omegab: 0.049795
  h: 0.6674
  ns: 0.96605
  sigma8: 0.81
  w0: -1.0
  wa: 0.0
  mnu: 0.0
  Neff: 3.044
observables: ["WL", "GCsp"]
likelihoods:
  - type: "photometric"
    observables: ["WL"]
  - type: "spectroscopic"
    observables: ["GCsp"]
    leg_flag: "wedges"
    covariance_from: "theory"
options:
  accuracy: 1
  feedback: 1
  code: "symbolic"
  survey_name: "Euclid"
  survey_name_photo: "Euclid-Photometric-ISTF-Pessimistic"
  survey_name_spectro: "Euclid-Spectroscopic-ISTF-Pessimistic"
  specs_dir: "cosmicfishpie/configs/default_survey_specifications/"
  cosmo_model: "LCDM"
  symbolic_config_yaml: "cosmicfishpie/configs/default_boltzmann_yaml_files/symbolic/default.yaml"
priors:
  Omegam: [0.24, 0.4]
  Omegab:
    type: gaussian
    loc: 0.049795
    scale: 0.00055
  sigma8: [0.75, 0.87]
sampler_settings:
  n_live: 500
  n_networks: 1
  n_batch: 32
  pool: 32
  n_eff: 2000
  discard_exploration: true
