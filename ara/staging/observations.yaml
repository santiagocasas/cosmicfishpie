- id: O24
  timestamp: '2026-10-30T15:40'
  provenance: ai-suggested
  content: >-
    The SYREN-NEW versus JAXcosmo marginalized 10^9As difference is carried by the linear
    power-spectrum shape, not by the nonlinear prescription: at equal As the two "Eisenstein-Hu"
    linear models differ by up to a few percent in a k-dependent way (SYREN-NEW is the no-wiggle
    fit times a fitted correction to the true linear spectrum), and Halofit fed with the SYREN-NEW
    linear shape moves the JAX amplitude error from 0.0264 to 0.0301 (SYREN 0.0294).
  context: >-
    Follow-up to N92 answering the objection that both backends use Eisenstein-Hu.
  potential_type: claim
  bound_to: [N93]
