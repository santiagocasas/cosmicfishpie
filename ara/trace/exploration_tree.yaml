- id: N93
  type: experiment
  title: Show the SYREN-NEW linear emulator, not the nonlinear prescription, carries the As gap
  provenance: ai-executed
  timestamp: '2026-10-30T15:40'
  also_depends_on: [N92]
  result: >-
    Checked the objection that both backends are Eisenstein-Hu and should agree. They are not
    the same formula: jax_cosmo evaluates the EH 1998 fit with baryon wiggles, while SYREN-NEW
    (symbolic_pofk/linear_new.py) uses the no-wiggle EH fit times exp(logF), a Bartlett et al.
    2023 fitted correction of the true linear spectrum, a growth correction R and an 18-coefficient
    S(k) correction. At equal As the linear spectra differ by +2.2% (k~0.016), -3.9% (k~0.1)
    and +1.6% (k~0.5 h/Mpc) with a k-dependent sign; growth agrees to 4e-4 and sigma8(z=0)
    to 0.03%, so this is shape, not amplitude. Fed Halofit with the SYREN-NEW linear shape inside
    the JAX photometric observable (same kernels, covariance, Fisher assembly, FD derivatives):
    marginalized 10^9As = 0.0301323, i.e. +2.35% with respect to SYREN 0.0294396 and +14.1%
    with respect to plain EH+Halofit 0.0264081. The linear input therefore carries essentially all
    of the 10% gap and the nonlinear prescriptions work in the opposite direction at the percent
    level. Extended scripts/validation/compare_theory_amplitude_response.py with linear_shape_table
    and the HalofitOnSyrenLinear bridge; both reproduce this run. Documented in
    docs/source/jaxcosmo.md and CHANGELOG; committed as 1c5b946; no push.
  evidence:
  - cfp-jaxcosmo/scripts/validation/compare_theory_amplitude_response.py
  - cfp-jaxcosmo/docs/source/jaxcosmo.md
  - cfp-jaxcosmo/CHANGELOG.md
  - cfp-dev/ara/evidence/tables/jaxcosmo_as_decomposition_2026-10-30.yaml
  status: resolved
- id: N92
  type: experiment
  title: Decompose the ~10% SYREN-NEW versus JAXcosmo 10^9As Fisher difference
  provenance: ai-executed
  timestamp: '2026-10-30T14:25'
  result: >-
    Extended the timing script to two fiducials and a JAX-FD control, and added
    scripts/validation/compare_theory_amplitude_response.py. Fiducials 2.1/0.32/0.05/0.67 and
    2.15/0.31/0.049/0.68, ns=0.96 and mnu=0 fixed, four cosmological plus 13 nuisance
    parameters. The provider cache keys on the fiducial, so the second fiducial re-pays trace
    and compile: AD cold 27.1 s then 23.4 s, warm 0.033/0.035 s; JAX-FD 5.6/6.5 s; SYREN-FD
    6.9/7.6 s. Marginalized 10^9As: SYREN 0.0294396/0.0307265, JAX-AD 0.0264081/0.0272525
    (-10.3%, -11.3%). Theory response dlnP_nl/dlnAs ratios SYREN/JAX 0.9795, 0.9826, 0.9942,
    1.0037 at z=0,0.5,1,2, with JAX autodiff reproducing the finite-difference response to
    7.3e-06. Unmarginalized 10^9As 0.00191324 vs 0.00186387 (-2.6%); cosmology-only +6.1%
    (JAX worse); adding the ten galaxy biases gives -10.4%. r(As,b8) -0.365 vs -0.275.
    JAX AD versus JAX FD Fisher max difference 1.8e-05 at both fiducials. Decisive hybrid:
    SYREN-NEW power spectrum inside the JAX observable gives 0.0294160, 0.9992 of the SYREN
    result, with fiducial Cl agreement max|dC|/max|C| 8.3e-04. Conclusion: a genuine
    matter-power-model difference amplified by galaxy-bias marginalization, not the
    observable, covariance, Fisher assembly or autodiff. Response-optimised SYREN
    coefficient sets raise this amplitude error (0.0299-0.0307) and do not close it.
    Documented in docs/source/jaxcosmo.md; committed as 022d02a; no push.
  evidence:
  - cfp-jaxcosmo/scripts/validation/compare_theory_amplitude_response.py
  - cfp-jaxcosmo/scripts/validation/time_syren_vs_jaxcosmo.py
  - cfp-jaxcosmo/docs/source/jaxcosmo.md
  - cfp-jaxcosmo/CHANGELOG.md
  - cfp-dev/ara/evidence/tables/jaxcosmo_as_decomposition_2026-10-30.yaml
  status: resolved
  also_depends_on: [N88, N91]
