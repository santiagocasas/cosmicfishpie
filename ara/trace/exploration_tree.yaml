  title: Review of the jaxcosmo branch, fixes F1-F9 and a prepared jax-cosmo Halofit patch
  provenance: ai-executed
  timestamp: '2026-10-29T14:46'
  result: >-
    Review found and fixed: Savitzky-Golay operator orientation (fiducial lnP agreement with
    legacy 7.9e-05 -> 2.2e-06, Fisher parity unchanged at 1.5e-06); stale observable cache
