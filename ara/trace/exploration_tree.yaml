    box cosmologies x 4 redshifts (worst residual 4.4e-16, differs from jax-cosmo by up to
    0.59% because of jax-cosmo's own interpolation error) and rewritten as fori_loop plus one
    implicit-function step (same values to 1.6e-15, Jacobian cost 24.5 s -> 8.8 s, photometric
    AD Fisher 37.6 s -> 18.3 s). Added 31 tests (suite 443 -> 474 passed). ARA duplicate top-level
    YAML keys repaired and O19 corrected without erasing its history. Prepared, not pushed,
    jax-cosmo branch smooth-halofit-nonlinear-scale (d193ebf): their 25 tests pass including the
    CCL comparisons; the new derivative test fails on master and passes with the patch (1% step
    AD-vs-FD error 2.4e-01 -> 1.0e-03). Supersedes the 7.9e-05 lnP figure quoted in N85.
