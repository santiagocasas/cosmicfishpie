  content: >-
    jax-cosmo Halofit nonlinear scale from the fixed-grid interp(sigma=1) is only piecewise smooth:
    at a 1% step the autodiff and finite-difference derivatives of P differ by 24% of the
    derivative scale (k_nl alone 3%), shrinking to 1e-5 at 0.1%; a Newton solve with an implicit
    final step gives 1.0e-03 at 1%, matches jax-cosmo's own tests (CCL comparisons) and changes
    values by up to 0.6% over the CFP box.
  context: Measured on unmodified jax-cosmo master vs the local patch branch.
