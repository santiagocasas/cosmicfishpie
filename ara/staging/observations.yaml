- id: O19
  timestamp: '2026-10-28T13:49'
  provenance: ai-suggested
  content: >-
    Outside its tabulated range the legacy power spline extrapolates while a direct
    Halofit evaluation uses the model, so the first k row of the spectroscopic grid
    (k = kmin_GCsp*h = kmin_pk*h) can differ by ~1e-4 in lnP and by ~10% in the Omegam
    derivative there. The Fisher is unaffected (1e-5), and clipping k instead is worse:
    a clamp puts a derivative discontinuity exactly at the grid edges.
  context: Diagnosed while closing the spectroscopic parity; one row of 17425 per bin.
  correction: >-
    CORRECTED 2026-10-29T13:43 (review of the jaxcosmo branch): the premise is wrong. The legacy
    RectBivariateSpline CLAMPS to the edge value outside its table (it does not extrapolate);
    only the no-wiggle k=1 InterpolatedUnivariateSpline extrapolates linearly. The first-k /
    mu=1 mismatch is the clamp, and it is reproduced exactly by the new backend option
    NUMERICS.legacy_pk_clamp (AP-off + clamp parity 2.5e-5 in lnP). Direct evaluation stays the
    default. The original text is kept above for the record. See docs/source/jaxcosmo_review.md F5.
  potential_type: constraint
  bound_to: [N85]
  promoted: false
  promoted_to: null
  crystallized_via: null
  stale: false
- id: O18
  timestamp: '2026-10-28T13:49'
  provenance: ai-suggested
  content: >-
    The legacy no-wiggle smoothing window n_savgol = round(1.3585/log(1+dlnk)) depends on
    the h-scaled grid, and it flips 125 -> 126 between h(1-1%) and h, so the legacy 1%
    central dlnP/dh carries a quantisation jump: it reads 3.29 at a 1% step and 2.60 once
    the step drops below 0.3%. The JAX observable freezes the window at the fiducial h.
    Implication: h derivatives of the legacy spectroscopic pipeline should not be trusted
    at the default 1% step, and agreement between the two codes must be judged below 0.3%.
  context: Explains the apparent 17% h-derivative gap in the spectroscopic parity.
  potential_type: constraint
  bound_to: [N85]
  promoted: false
  promoted_to: null
  crystallized_via: null
